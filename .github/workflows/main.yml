name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  # ── Test gate ────────────────────────────────────────────────────────────────
  # Runs the app's full pytest/unittest suite (tests/) against a throwaway site
  # before the deploy job below is allowed to run. This is a new addition
  # (Phase 1 / HP-08, Report 3 Finding M-07) — previously this pipeline had no
  # test-execution step at all, so a regression the existing suite would catch
  # could still reach production. Runs on its own ephemeral MariaDB/Redis
  # instance, never against the production site — the deploy job is unchanged
  # below and still SSHes into production separately.
  test:
    name: Run App Test Suite
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379

      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379

    steps:
      - name: Notify Telegram - Deployment started
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=Deployment process initiated for Manufyxinvenza"

      - name: Checkout code
        id: checkout
        uses: actions/checkout@v4
        with:
          path: manufyxinvenzaerp

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install system dependencies
        id: install-sysdeps
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server wkhtmltopdf mariadb-client libmysqlclient-dev

      - name: Install bench
        id: install-bench
        run: pip install frappe-bench

      - name: Init bench + get apps
        id: init-bench
        run: |
          bench init --skip-redis-config-generation --python "$(which python3)" --frappe-branch version-15 test-bench
          cd test-bench
          bench get-app erpnext --branch version-15
          rm -rf apps/manufyxinvenzaerp
          cp -r "$GITHUB_WORKSPACE/manufyxinvenzaerp" apps/manufyxinvenzaerp

      - name: Configure site + install apps
        id: configure-site
        working-directory: test-bench
        run: |
          bench set-mariadb-host 127.0.0.1
          bench set-config -g root_login root
          bench set-config -g root_password root
          bench new-site test-site.local --force \
            --mariadb-root-password root \
            --admin-password admin \
            --no-mariadb-socket
          bench --site test-site.local install-app erpnext
          bench --site test-site.local install-app manufyxinvenzaerp

      - name: Run test suite
        id: run-tests
        working-directory: test-bench
        run: bench --site test-site.local run-tests --app manufyxinvenzaerp

      - name: Notify Telegram - Test environment completed
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=Completed test environment, moving to live server update"

      - name: Notify Telegram - Issue detected
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          FAILED_ID=$(echo "$STEPS_JSON" | jq -r 'to_entries[] | select(.value.outcome=="failure") | .key' | head -n1)

          case "$FAILED_ID" in
            checkout) STEP_DESC="Checkout code" ;;
            setup-python) STEP_DESC="Setup Python" ;;
            setup-node) STEP_DESC="Setup Node" ;;
            install-sysdeps) STEP_DESC="Install system dependencies" ;;
            install-bench) STEP_DESC="Install bench" ;;
            init-bench) STEP_DESC="Init bench + get apps" ;;
            configure-site) STEP_DESC="Configure site + install apps" ;;
            run-tests) STEP_DESC="Run test suite" ;;
            *) STEP_DESC="Unknown step" ;;
          esac

          MESSAGE="Issue: ${STEP_DESC} process failed. Remaining steps stopped, deploy will not run."

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"

  # ── Deploy ───────────────────────────────────────────────────────────────────
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        id: checkout-deploy
        uses: actions/checkout@v4

      - name: Deploy to Frappe Server
        id: ssh-deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            # ── Setup ────────────────────────────────────────────────────────
            BENCH_PATH="/home/manufyxv15/frappe-bench"
            APP_PATH="$BENCH_PATH/apps/manufyxinvenzaerp"
            LOG_DIR="$BENCH_PATH/Auto-deploy-logs"
            LOG_FILE="$LOG_DIR/deploy_$(date +'%Y-%m-%d_%H-%M-%S').log"
            SITE="erp.manufyx.co.in"

            mkdir -p "$LOG_DIR"

            echo "============================================" | tee -a "$LOG_FILE"
            echo " AUTO DEPLOY STARTED"                        | tee -a "$LOG_FILE"
            echo " Date     : $(date)"                         | tee -a "$LOG_FILE"
            echo " App Path : $APP_PATH"                       | tee -a "$LOG_FILE"
            echo " Site     : $SITE"                           | tee -a "$LOG_FILE"
            echo "============================================" | tee -a "$LOG_FILE"

            # ── Step 1: Git Pull ─────────────────────────────────────────────
            echo "" | tee -a "$LOG_FILE"
            echo "[STEP 1/5] Git Pull" | tee -a "$LOG_FILE"
            echo "--------------------------------------------" | tee -a "$LOG_FILE"

            cd "$APP_PATH" || { echo "ERROR: App path not found: $APP_PATH" | tee -a "$LOG_FILE"; exit 1; }

            git pull 2>&1 | tee -a "$LOG_FILE"
            GIT_STATUS=${PIPESTATUS[0]}

            if [ $GIT_STATUS -ne 0 ]; then
              echo "ERROR: git pull failed with exit code $GIT_STATUS" | tee -a "$LOG_FILE"
              exit 1
            fi
            echo "✅ Git pull successful" | tee -a "$LOG_FILE"

            # ── Step 2: Bench Build ──────────────────────────────────────────
            echo "" | tee -a "$LOG_FILE"
            echo "[STEP 2/5] Bench Build — compiling JS/CSS/Vue assets" | tee -a "$LOG_FILE"
            echo "--------------------------------------------" | tee -a "$LOG_FILE"

            cd "$BENCH_PATH" || { echo "ERROR: Bench path not found" | tee -a "$LOG_FILE"; exit 1; }

            bench build --app manufyxinvenzaerp 2>&1 | tee -a "$LOG_FILE"
            BUILD_STATUS=${PIPESTATUS[0]}

            if [ $BUILD_STATUS -ne 0 ]; then
              echo "ERROR: bench build failed with exit code $BUILD_STATUS" | tee -a "$LOG_FILE"
              exit 1
            fi
            echo "✅ Bench build successful" | tee -a "$LOG_FILE"

            # ── Step 3: Clear Cache ──────────────────────────────────────────
            echo "" | tee -a "$LOG_FILE"
            echo "[STEP 3/5] Clear Cache — removing stale metadata & controllers" | tee -a "$LOG_FILE"
            echo "--------------------------------------------" | tee -a "$LOG_FILE"

            bench --site "$SITE" clear-cache 2>&1 | tee -a "$LOG_FILE"
            CACHE_STATUS=${PIPESTATUS[0]}

            if [ $CACHE_STATUS -ne 0 ]; then
              echo "ERROR: clear-cache failed with exit code $CACHE_STATUS" | tee -a "$LOG_FILE"
              exit 1
            fi
            echo "✅ Cache cleared successfully" | tee -a "$LOG_FILE"

            # ── Step 4: Bench Migrate ────────────────────────────────────────
            echo "" | tee -a "$LOG_FILE"
            echo "[STEP 4/5] Bench Migrate — applying schema changes" | tee -a "$LOG_FILE"
            echo "--------------------------------------------" | tee -a "$LOG_FILE"

            bench --site "$SITE" migrate 2>&1 | tee -a "$LOG_FILE"
            MIGRATE_STATUS=${PIPESTATUS[0]}

            if [ $MIGRATE_STATUS -ne 0 ]; then
              echo "ERROR: bench migrate failed with exit code $MIGRATE_STATUS" | tee -a "$LOG_FILE"
              exit 1
            fi
            echo "✅ Bench migrate successful" | tee -a "$LOG_FILE"

            # ── Step 5: Bench Restart ────────────────────────────────────────
            echo "" | tee -a "$LOG_FILE"
            echo "[STEP 5/5] Bench Restart — reloading workers & scheduler" | tee -a "$LOG_FILE"
            echo "--------------------------------------------" | tee -a "$LOG_FILE"

            bench restart 2>&1 | tee -a "$LOG_FILE"
            RESTART_STATUS=${PIPESTATUS[0]}

            if [ $RESTART_STATUS -ne 0 ]; then
              echo "ERROR: bench restart failed with exit code $RESTART_STATUS" | tee -a "$LOG_FILE"
              exit 1
            fi
            echo "✅ Bench restart successful" | tee -a "$LOG_FILE"

            # ── Summary ──────────────────────────────────────────────────────
            echo "" | tee -a "$LOG_FILE"
            echo "============================================" | tee -a "$LOG_FILE"
            echo " ✅ DEPLOY COMPLETED SUCCESSFULLY"           | tee -a "$LOG_FILE"
            echo " Finished : $(date)"                         | tee -a "$LOG_FILE"
            echo " Log file : $LOG_FILE"                       | tee -a "$LOG_FILE"
            echo "============================================" | tee -a "$LOG_FILE"

            # ── Old log cleanup (keep last 20 deploys only) ──────────────────
            cd "$LOG_DIR" && ls -t | tail -n +21 | xargs -r rm --

      - name: Notify Telegram - Deploy completed
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=Live deploy completed"

      - name: Notify Telegram - Issue detected
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          FAILED_ID=$(echo "$STEPS_JSON" | jq -r 'to_entries[] | select(.value.outcome=="failure") | .key' | head -n1)

          case "$FAILED_ID" in
            checkout-deploy) STEP_DESC="Checkout code" ;;
            ssh-deploy) STEP_DESC="Live server update (SSH deploy)" ;;
            *) STEP_DESC="Unknown step" ;;
          esac

          MESSAGE="Issue: ${STEP_DESC} process failed. Remaining steps stopped."

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"